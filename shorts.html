<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쇼츠 결과 카드</title>
<!-- 사용법: shorts.html?date=2026-11-24  (날짜 생략 시 최근 거래일)
     1080x1920 으로 캡처해서 쇼츠 마지막 3초에 넣는다. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
@font-face { font-family: "BHS"; src: url("fonts/BlackHanSans.ttf"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; }
#card { width: 1080px; height: 1920px; position: relative; overflow: hidden; color: #e9fff4; font-family: "Noto Sans KR", sans-serif;
  background: radial-gradient(ellipse at 50% 35%, #0f3d2a 0%, #06120d 55%, #020604 100%); }
#card.loss { background: radial-gradient(ellipse at 50% 35%, #3d0f17 0%, #12060a 55%, #050203 100%); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0,255,140,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,140,.06) 1px, transparent 1px); background-size: 60px 60px; }
.loss .grid { background-image: linear-gradient(rgba(255,77,94,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,77,94,.06) 1px, transparent 1px); }
.inner { position: absolute; inset: 0; padding: 150px 80px 260px; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; }
.day { font-family: "BHS"; font-size: 96px; background: #fff; color: #06120d; padding: 6px 30px 0; border-radius: 22px; transform: rotate(-3deg); box-shadow: 10px 10px 0 #00ff8c; line-height: 1.15; }
.loss .day { box-shadow: 10px 10px 0 #ff4d5e; }
.sym { font-family: "BHS"; font-size: 84px; text-shadow: 0 0 24px rgba(0,255,140,.6); }
.date { margin-top: 60px; font-size: 46px; font-weight: 700; color: #8fb5a3; }
.label { margin-top: 30px; font-family: "BHS"; font-size: 80px; }
.pnl { font-family: "BHS"; font-size: 230px; line-height: 1; letter-spacing: -6px; -webkit-text-stroke: 8px #000; paint-order: stroke fill; text-shadow: 0 0 50px rgba(0,255,140,.35); color: #00ff8c; }
.loss .pnl { color: #ff4d5e; text-shadow: 0 0 50px rgba(255,77,94,.35); }
.bar { margin-top: 40px; height: 54px; border-radius: 28px; background: rgba(0,0,0,.5); border: 3px solid rgba(255,255,255,.15); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, #00b864, #00ff8c); }
.loss .bar i { background: linear-gradient(90deg, #8a1520, #ff4d5e); }
.barlabel { display: flex; justify-content: space-between; font-size: 38px; font-weight: 900; margin-top: 14px; }
.barlabel .goal { color: #ffe100; }
.stamp { position: absolute; right: 80px; top: 395px; font-family: "BHS"; font-size: 84px; color: #ffe100; border: 10px solid #ffe100; border-radius: 26px; padding: 6px 26px 0; transform: rotate(8deg); opacity: .95; }
.boxes { margin-top: 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.box { background: rgba(0,0,0,.45); border: 3px solid rgba(255,255,255,.12); border-radius: 30px; padding: 28px 34px; }
.box span { display: block; font-size: 34px; font-weight: 700; color: #8fb5a3; }
.box b { white-space: nowrap; font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; }
.pos { color: #00ff8c; } .neg { color: #ff4d5e; }
.foot { margin-top: auto; text-align: center; font-size: 34px; font-weight: 700; color: #8fb5a3; }
.foot b { color: #fff; }
</style>
</head>
<body>
<div id="card">
  <div class="grid"></div>
  <div class="inner">
    <div class="top"><div class="day" id="day"></div><div class="sym">$SOXL</div></div>
    <div class="date" id="date"></div>
    <div class="label">오늘 순손익</div>
    <div class="pnl" id="pnl"></div>
    <div class="bar"><i id="fill"></i></div>
    <div class="barlabel"><span id="pct"></span><span class="goal">목표 $1,000</span></div>
    <div class="boxes">
      <div class="box"><span>체결 / 승패</span><b id="trades"></b></div>
      <div class="box"><span>수수료+펀딩</span><b id="fees"></b></div>
      <div class="box"><span>누적 손익</span><b id="cum"></b></div>
      <div class="box"><span>운용 시드</span><b id="eq"></b></div>
    </div>
    <div class="foot">전체 매매일지는 <b>프로필 링크</b>에서 확인<br><span id="sample"></span></div>
  </div>
  <div class="stamp" id="stamp" hidden>달성!</div>
</div>
<script>
const fmt = (v, d = 0) => (v < 0 ? "-" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const sfmt = (v, d = 0) => (v > 0 ? "+" : "") + fmt(v, d);
const WD = ["일", "월", "화", "수", "목", "금", "토"];
(async () => {
  const idx = await (await fetch("data/index.json", { cache: "no-store" })).json();
  const days = idx.days, cfg = idx.config;
  const want = new URLSearchParams(location.search).get("date");
  const i = want ? days.findIndex(d => d.date === want) : days.length - 1;
  const d = days[i];
  const cum = days.slice(0, i + 1).reduce((a, x) => a + x.net_pnl, 0);
  const dt = new Date(d.date + "T00:00:00");
  const $ = id => document.getElementById(id);
  $("day").textContent = "DAY " + (i + 1);
  $("date").textContent = `${dt.getFullYear()}.${dt.getMonth() + 1}.${dt.getDate()} (${WD[dt.getDay()]}) 미국장`;
  $("pnl").textContent = sfmt(d.net_pnl);
  const len = $("pnl").textContent.length; if (len > 6) $("pnl").style.fontSize = Math.floor(230 * 6.3 / len) + "px";
  document.getElementById("card").classList.toggle("loss", d.net_pnl < 0);
  const pct = d.net_pnl / cfg.goal_per_day * 100;
  $("fill").style.width = Math.min(100, Math.abs(pct)) + "%";
  $("pct").textContent = `${pct.toFixed(0)}%`;
  $("stamp").hidden = pct < 100;
  $("trades").textContent = `${d.trades}건 · ${d.wins}승${d.losses}패`;
  const f = d.fees + d.funding; $("fees").textContent = sfmt(f); $("fees").className = f < 0 ? "neg" : "pos";
  $("cum").textContent = sfmt(cum); $("cum").className = cum < 0 ? "neg" : "pos";
  $("eq").textContent = fmt(d.equity_end);
  if (d.sample) $("sample").textContent = "※ 샘플 데이터";
  document.body.dataset.ready = "1";
})();
</script>
</body>
</html>
